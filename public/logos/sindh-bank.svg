<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="100" fill="#1e3a8a" rx="8"/>
  
  <!-- Bank Icon -->
  <g transform="translate(30, 20)">
    <rect x="0" y="25" width="70" height="40" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="0,25 35,0 70,25" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="17.5" y1="25" x2="17.5" y2="65" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="35" y1="25" x2="35" y2="65" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="52.5" y1="25" x2="52.5" y2="65" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="35" font-size="14" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">Sindh Bank</text>
  <text x="100" y="55" font-size="10" fill="#e0e7ff" font-family="Arial, sans-serif">Pakistan</text>
