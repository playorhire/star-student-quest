<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient effect with rectangle -->
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="100" fill="#ffffff" rx="8"/>
  
  <!-- Star Icon -->
  <g transform="translate(20, 15)">
    <polygon points="30,5 37,25 58,25 41,38 48,58 30,45 12,58 19,38 2,25 23,25" fill="url(#starGradient)" stroke="#f59e0b" stroke-width="1"/>
  </g>
  
  <!-- Text -->
  <text x="75" y="35" font-size="16" font-weight="bold" fill="#111827" font-family="Arial, sans-serif">StarPoints</text>
  <text x="75" y="55" font-size="11" fill="#6b7280" font-family="Arial, sans-serif">Rewards Program ✨</text>
</svg>
